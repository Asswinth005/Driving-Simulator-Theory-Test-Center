<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="dsBgGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="dsRimGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#93C5FD" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="dsTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="dsCarGradFull" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>

    <filter id="dsShadowFull" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1D4ED8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Logo Icon Container (Left side) -->
  <g transform="translate(3, 3)">
    <rect x="0" y="0" width="44" height="44" rx="13" fill="url(#dsBgGradFull)" filter="url(#dsShadowFull)"/>
    <rect x="0.75" y="0.75" width="42.5" height="42.5" rx="12.25" stroke="url(#dsRimGradFull)" stroke-width="1.5" fill="none"/>
    
    <!-- HUD Ring -->
    <path d="M 10 22 A 12 12 0 0 1 34 22" stroke="#60A5FA" stroke-width="1.8" stroke-dasharray="3 2.5" opacity="0.6"/>
    <circle cx="22" cy="22" r="17" stroke="white" stroke-width="1" stroke-dasharray="1 7" opacity="0.35"/>

    <!-- Highway lines -->
    <path d="M 14 36 L 19 25 L 25 25 L 30 36" fill="none" stroke="#60A5FA" stroke-width="1.2" opacity="0.45"/>
    <path d="M 22 36 L 22 27" stroke="#93C5FD" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.75"/>

    <!-- Car -->
    <path d="M 15 21.5 C 16.5 16.2, 27.5 16.2, 29 21.5 Z" fill="url(#dsCarGradFull)" opacity="0.95"/>
    <path d="M 16.8 21 C 17.8 17.5, 26.2 17.5, 27.2 21 Z" fill="#1E293B" opacity="0.85"/>
    <path d="M 8.5 26.5 C 8.5 23.8, 11.8 21.8, 15.5 21.5 L 28.5 21.5 C 32.2 21.8, 35.5 23.8, 35.5 26.5 C 35.5 28.2, 34.2 29.2, 32.8 29.2 L 11.2 29.2 C 9.8 29.2, 8.5 28.2, 8.5 26.5 Z" fill="url(#dsCarGradFull)"/>
    <path d="M 10 25 L 14 24.5" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 34 25 L 30 24.5" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="11.5" cy="25" r="1.2" fill="#FFFFFF"/>
    <circle cx="32.5" cy="25" r="1.2" fill="#FFFFFF"/>
    <rect x="18" y="25.5" width="8" height="2" rx="1" fill="#0F172A" opacity="0.7"/>
    <rect x="10" y="28.5" width="4.5" height="3" rx="1.5" fill="#0F172A"/>
    <rect x="29.5" y="28.5" width="4.5" height="3" rx="1.5" fill="#0F172A"/>
  </g>

  <!-- Typography: DriveSim -->
  <text x="58" y="32" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#0F172A">Drive</tspan>
    <tspan fill="url(#dsTextGrad)">Sim</tspan>
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="58" y="44" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#64748B" letter-spacing="1.8">
    SIMULATOR &amp; ACADEMY
  </text>
</svg>
