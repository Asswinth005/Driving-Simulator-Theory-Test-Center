<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Glass Rim Gradient -->
    <linearGradient id="dsRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#93C5FD" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.5" />
    </linearGradient>

    <!-- Car & Tech Glow -->
    <linearGradient id="dsCarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>

    <!-- Steering HUD Ring Grad -->
    <linearGradient id="dsHudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dsShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#1D4ED8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#dsBgGrad)" filter="url(#dsShadow)"/>

  <!-- Inner Metallic Glass Border Ring -->
  <rect x="2.75" y="2.75" width="42.5" height="42.5" rx="12.25" stroke="url(#dsRimGrad)" stroke-width="1.5" fill="none"/>

  <!-- HUD Steering Wheel Arc Motif (Background detail) -->
  <path d="M 12 24 A 12 12 0 0 1 36 24" stroke="url(#dsHudGrad)" stroke-width="1.8" stroke-dasharray="3 2.5" stroke-linecap="round" opacity="0.6"/>
  <circle cx="24" cy="24" r="17" stroke="white" stroke-width="1" stroke-dasharray="1 7" opacity="0.35"/>

  <!-- Highway / Road Perspective Lines -->
  <path d="M 16 38 L 21 27 L 27 27 L 32 38" fill="none" stroke="#60A5FA" stroke-width="1.2" opacity="0.45"/>
  <path d="M 24 38 L 24 29" stroke="#93C5FD" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.75"/>

  <!-- Aerodynamic Modern Car Silhouette -->
  <!-- Roof / Windshield -->
  <path d="M 17 23.5 C 18.5 18.2, 29.5 18.2, 31 23.5 Z" fill="url(#dsCarGrad)" opacity="0.95"/>
  <path d="M 18.8 23 C 19.8 19.5, 28.2 19.5, 29.2 23 Z" fill="#1E293B" opacity="0.85"/>
  
  <!-- Sleek Car Hood & Body -->
  <path d="M 10.5 28.5 C 10.5 25.8, 13.8 23.8, 17.5 23.5 L 30.5 23.5 C 34.2 23.8, 37.5 25.8, 37.5 28.5 C 37.5 30.2, 36.2 31.2, 34.8 31.2 L 13.2 31.2 C 11.8 31.2, 10.5 30.2, 10.5 28.5 Z" fill="url(#dsCarGrad)"/>

  <!-- Headlights (LED Neon Strips) -->
  <path d="M 12 27 L 16 26.5" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 36 27 L 32 26.5" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="13.5" cy="27" r="1.2" fill="#FFFFFF"/>
  <circle cx="34.5" cy="27" r="1.2" fill="#FFFFFF"/>

  <!-- Front Grille / Air Intake -->
  <rect x="20" y="27.5" width="8" height="2" rx="1" fill="#0F172A" opacity="0.7"/>

  <!-- Wheels / Tires -->
  <rect x="12" y="30.5" width="4.5" height="3" rx="1.5" fill="#0F172A"/>
  <rect x="31.5" y="30.5" width="4.5" height="3" rx="1.5" fill="#0F172A"/>
  <circle cx="14.25" cy="32" r="0.8" fill="#60A5FA"/>
  <circle cx="33.75" cy="32" r="0.8" fill="#60A5FA"/>
</svg>
