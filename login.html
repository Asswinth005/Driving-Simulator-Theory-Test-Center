<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="gold-obsidian">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>Sign In · DriveSim — Driving Simulator &amp; Theory Test Center</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='28' fill='%232563EB'/%3E%3Ccircle cx='38' cy='44' r='6' fill='%23FFFFFF'/%3E%3Ccircle cx='62' cy='44' r='6' fill='%23FFFFFF'/%3E%3Crect x='35' y='52' width='30' height='8' rx='4' fill='%23FFFFFF'/%3E%3C/svg%3E">

    <!-- Tailwind CSS -->
    <script src="tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'gift-slate': 'var(--color-primary)',
                        'gift-slate-light': 'var(--color-primary-light)',
                        'gift-slate-dark': 'var(--color-primary-dark)',
                        'gift-slate-bright': 'var(--color-primary-bright)',
                        'gift-accent': 'var(--color-accent)',
                        'bg-warm': 'var(--color-bg-warm)',
                        'neutral-dark': 'var(--color-text-dark)',
                        'neutral-light': '#E8EDF2',
                        'dark-bg': '#0A0D12',
                        'dark-card': '#141A24',
                        'dark-surface': '#1C2432',
                    },
                    fontFamily: {
                        'sans': ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        'display': ['Outfit', 'Plus Jakarta Sans', 'sans-serif'],
                        'premium': ['Outfit', 'sans-serif'],
                        'alt': ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out',
                        'float-slow': 'floatSlow 6s ease-in-out infinite',
                        'slide-up': 'slideUp 0.5s ease-out',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(12px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        floatSlow: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-6px)' } },
                        slideUp: { '0%': { transform: 'translateY(30px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                    }
                }
            }
        }
    </script>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        :root, [data-theme="gold-obsidian"] {
            --color-primary: #2563EB;
            --color-primary-light: #60A5FA;
            --color-primary-dark: #1D4ED8;
            --color-primary-bright: #93C5FD;
            --color-accent: #3B82F6;
            --color-bg-warm: #F8FAFC;
            --color-text-dark: #0F172A;
            --color-rgb-primary: 37, 99, 235;
            --color-rgb-bright: 147, 197, 253;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--color-bg-warm);
            color: var(--color-text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .dark body {
            background-color: #0A0D12;
            color: #E2E8F0;
        }

        .dark .text-neutral-dark { color: #E2E8F0; }
        .dark input, .dark select, .dark textarea { color: #FFFFFF !important; }

        .gold-gradient-text {
            background: linear-gradient(135deg, #60A5FA 0%, #2563EB 50%, #1D4ED8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Theme toggles — top-right */
        .theme-toggle-wrapper {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }

        [dir="rtl"] .theme-toggle-wrapper {
            right: auto;
            left: 16px;
        }

        .toggle-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(var(--color-rgb-primary), 0.12);
            color: var(--color-primary);
            transition: all 0.3s ease;
            border: 1px solid rgba(var(--color-rgb-primary), 0.2);
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        .dark .toggle-btn {
            background: rgba(var(--color-rgb-bright), 0.12);
            color: var(--color-primary-bright);
            border-color: rgba(var(--color-rgb-bright), 0.2);
        }

        .toggle-btn:hover {
            transform: scale(1.08);
            background: var(--color-primary);
            color: #FFFFFF;
        }

        .dark .toggle-btn:hover {
            background: var(--color-primary-bright);
            color: #0A0D12;
        }

        /* Login Card */
        .login-card {
            background: #FFFFFF;
            border-radius: 36px;
            padding: 2.5rem 2.2rem 2.2rem;
            box-shadow: 0 25px 50px rgba(var(--color-rgb-primary), 0.10);
            border: 1px solid rgba(var(--color-rgb-primary), 0.15);
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .dark .login-card {
            background: #141A24;
            border-color: rgba(var(--color-rgb-bright), 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* Input styling */
        .login-input {
            width: 100%;
            padding: 0.9rem 1.2rem 0.9rem 3rem;
            border-radius: 50px;
            border: 1.5px solid rgba(var(--color-rgb-primary), 0.15);
            background: #FFFFFF;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            color: var(--color-text-dark);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .dark .login-input {
            background: #0A0D12;
            border-color: rgba(var(--color-rgb-bright), 0.2);
            color: #E2E8F0;
        }

        .login-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(var(--color-rgb-primary), 0.15);
        }

        .dark .login-input:focus {
            border-color: var(--color-primary-bright);
            box-shadow: 0 0 0 4px rgba(var(--color-rgb-bright), 0.12);
        }

        .login-input::placeholder {
            color: rgba(var(--color-text-dark), 0.4);
        }
        .dark .login-input::placeholder {
            color: rgba(226, 232, 240, 0.3);
        }

        /* Password wrapper */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper .login-input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--color-primary);
            font-size: 1rem;
            transition: color 0.2s;
            background: transparent;
            border: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dark .toggle-password {
            color: var(--color-primary-bright);
        }

        .toggle-password:hover {
            color: var(--color-primary-dark);
        }

        [dir="rtl"] .toggle-password {
            right: auto;
            left: 1rem;
        }

        [dir="rtl"] .password-wrapper .login-input {
            padding-right: 1.2rem;
            padding-left: 3rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        /* Primary button */
        .btn-gift {
            background: linear-gradient(135deg, var(--color-primary-light) 0%, var(--color-primary) 100%);
            color: #FFFFFF;
            font-weight: 700;
            padding: 0.9rem 1.8rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
            box-shadow: 0 4px 15px rgba(var(--color-rgb-primary), 0.3);
        }

        .dark .btn-gift {
            background: linear-gradient(135deg, var(--color-primary-bright) 0%, var(--color-primary) 100%);
            color: #0A0D12;
            box-shadow: 0 4px 15px rgba(var(--color-rgb-bright), 0.3);
        }

        .btn-gift:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(var(--color-rgb-primary), 0.4);
        }

        .dark .btn-gift:hover {
            box-shadow: 0 10px 25px rgba(var(--color-rgb-bright), 0.4);
        }

        /* Social login buttons */
        .social-btn {
            flex: 1;
            padding: 0.8rem 0.5rem;
            border-radius: 50px;
            border: 1.5px solid rgba(var(--color-rgb-primary), 0.15);
            background: #FFFFFF;
            color: var(--color-text-dark);
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            gap: 0.5rem;
            white-space: nowrap;
            cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .dark .social-btn {
            background: #0A0D12;
            border-color: rgba(var(--color-rgb-bright), 0.2);
            color: #E2E8F0;
        }

        .social-btn:hover {
            background: var(--color-bg-warm);
            border-color: var(--color-primary);
            transform: translateY(-2px);
        }

        .dark .social-btn:hover {
            background: rgba(var(--color-rgb-bright), 0.08);
            border-color: var(--color-primary-bright);
        }

        .social-btn i {
            font-size: 1.1rem;
            color: var(--color-primary);
        }

        .dark .social-btn i {
            color: var(--color-primary-bright);
        }

        /* Logo container */
        .logo-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .brand-logo {
            background: linear-gradient(135deg, var(--color-primary-light), var(--color-primary));
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(var(--color-rgb-primary), 0.25);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .brand-logo:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .dark .brand-logo {
            background: linear-gradient(135deg, var(--color-primary-bright), var(--color-primary));
        }

        .brand-logo i {
            font-size: 1.6rem;
            color: #FFFFFF;
        }

        .dark .brand-logo i {
            color: #0A0D12;
        }

        .welcome-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--color-text-dark);
            margin-top: 1.5rem;
            margin-bottom: 0.25rem;
            text-align: center;
            line-height: 1.2;
        }

        .dark .welcome-title {
            color: #E2E8F0;
        }

        .welcome-subtitle {
            font-size: 0.9rem;
            color: var(--color-text-dark);
            text-align: center;
            margin-bottom: 0.5rem;
            font-weight: 400;
            opacity: 0.7;
        }

        .dark .welcome-subtitle {
            color: #E2E8F0;
        }

        /* RTL adjustments */
        [dir="rtl"] .login-input {
            padding: 0.9rem 3rem 0.9rem 1.2rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        [dir="rtl"] .fa-arrow-right {
            transform: scaleX(-1);
        }

        /* Responsive */
        @media (max-height: 650px) {
            .login-card { padding: 1.2rem 1.5rem; transform: scale(0.92); transform-origin: center; }
            .logo-center { margin-bottom: 0.5rem; }
            .welcome-title { font-size: 1.4rem; margin-top: 0.5rem; }
            .welcome-subtitle { font-size: 0.8rem; margin-bottom: 0.5rem; }
            .login-input { padding: 0.65rem 1rem 0.65rem 2.5rem; font-size: 0.85rem; }
            .btn-gift { padding: 0.65rem 1.2rem; font-size: 0.9rem; }
            .brand-logo { width: 38px; height: 38px; }
            .brand-logo i { font-size: 1.2rem; }
            .theme-toggle-wrapper { top: 8px; right: 8px; }
            .toggle-btn { width: 34px; height: 34px; font-size: 0.8rem; }
        }

        @media (max-width: 380px) {
            .login-card { padding: 1.5rem 1.2rem; border-radius: 24px; }
            .welcome-title { font-size: 1.3rem; }
            .login-input { padding: 0.7rem 1rem 0.7rem 2.8rem; font-size: 0.85rem; }
        }

        @media (max-width: 480px) {
            .theme-toggle-wrapper { top: 12px; right: 12px; }
            [dir="rtl"] .theme-toggle-wrapper { left: 12px; right: auto; }
        }

        .container-tight {
            max-width: 480px;
            width: 100%;
            padding: 0 1.5rem;
        }

        .custom-checkbox {
            accent-color: var(--color-primary);
        }

        .dark .custom-checkbox {
            accent-color: var(--color-primary-bright);
        }

        a {
            transition: all 0.2s ease;
        }

        /* Background decorative glow */
        .bg-glow {
            position: fixed;
            top: -30%;
            right: -20%;
            width: 60%;
            height: 80%;
            background: radial-gradient(circle, rgba(var(--color-rgb-primary), 0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .dark .bg-glow {
            background: radial-gradient(circle, rgba(var(--color-rgb-bright), 0.04) 0%, transparent 70%);
        }

        .bg-glow-left {
            position: fixed;
            bottom: -30%;
            left: -20%;
            width: 60%;
            height: 80%;
            background: radial-gradient(circle, rgba(var(--color-rgb-primary), 0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .dark .bg-glow-left {
            background: radial-gradient(circle, rgba(var(--color-rgb-bright), 0.03) 0%, transparent 70%);
        }

        /* Role selector styling */
        .role-selector {
            display: flex;
            gap: 0.5rem;
            background: rgba(var(--color-rgb-primary), 0.06);
            border-radius: 50px;
            padding: 0.25rem;
            border: 1px solid rgba(var(--color-rgb-primary), 0.1);
        }

        .dark .role-selector {
            background: rgba(var(--color-rgb-bright), 0.08);
            border-color: rgba(var(--color-rgb-bright), 0.15);
        }

        .role-btn {
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            background: transparent;
            color: var(--color-secondary-text);
            cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .role-btn.active {
            background: var(--color-primary);
            color: white;
            box-shadow: 0 4px 12px rgba(var(--color-rgb-primary), 0.25);
        }

        .dark .role-btn.active {
            background: var(--color-primary-bright);
            color: #0A0D12;
        }

        .role-btn:hover:not(.active) {
            background: rgba(var(--color-rgb-primary), 0.08);
        }

        .dark .role-btn:hover:not(.active) {
            background: rgba(var(--color-rgb-bright), 0.1);
        }
    </style>
</head>

<body>

    <!-- Background Glows -->
    <div class="bg-glow"></div>
    <div class="bg-glow-left"></div>

    <!-- ===== THEME TOGGLES - TOP-RIGHT ===== -->
    <div class="theme-toggle-wrapper">
        <button id="theme-toggle" class="toggle-btn" title="Dark / Light">
            <i class="fas fa-moon dark:hidden"></i>
            <i class="fas fa-sun hidden dark:inline"></i>
        </button>
        <button id="rtl-toggle" class="toggle-btn" title="RTL / LTR">
            ⇄
        </button>
    </div>

    <!-- ===== LOGIN CARD ===== -->
    <div class="container-tight relative z-10">
        <div class="login-card animate-fade-in">

            <!-- ===== LOGO - CENTERED ===== -->
            <div class="logo-center">
                <a href="index.html" class="flex items-center gap-3 group shrink-0">
                    <div class="brand-logo group-hover:rotate-6 transition duration-300">
                        <i class="fas fa-car-side"></i>
                    </div>
                    <div>
                        <span class="text-2xl font-display font-extrabold tracking-tight text-neutral-dark dark:text-white">
                            Drive<span class="gold-gradient-text">Sim</span>
                        </span>
                    </div>
                </a>

                <h1 class="welcome-title">Welcome Back</h1>
                <p class="welcome-subtitle">Sign in to manage your driving journey</p>
            </div>

          

            <!-- ===== LOGIN FORM ===== -->
            <form id="loginForm" class="space-y-5">

                <!-- Email field -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gift-slate input-icon">
                        <i class="fas fa-envelope w-5 text-sm"></i>
                    </span>
                    <input type="email" name="email" id="login-email" placeholder="Email address" required
                        class="login-input text-sm md:text-base">
                </div>

                <!-- Password field with eye icon -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gift-slate input-icon">
                        <i class="fas fa-lock w-5 text-sm"></i>
                    </span>
                    <input type="password" id="login-password" name="password" placeholder="Password" required
                        class="login-input text-sm md:text-base">
                    <button type="button" class="toggle-password" data-target="login-password"
                        aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- Remember + Forgot -->
                <div class="flex items-center justify-between text-xs md:text-sm">
                    <label class="flex items-center space-x-2 rtl:space-x-reverse cursor-pointer text-neutral-dark dark:text-gray-300">
                        <input type="checkbox" class="rounded border-gray-300 dark:border-gray-600 custom-checkbox" checked>
                        <span class="ml-1 rtl:mr-1">Remember me</span>
                    </label>
                    <a href="#" id="forgotPasswordLink"
                        class="text-neutral-dark dark:text-gray-300 hover:text-gift-slate font-semibold transition hover:underline">
                        Forgot password?
                    </a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-gift mt-2">
                    Sign In <i class="fas fa-sign-in-alt ml-2"></i>
                </button>

                <!-- Divider -->
                <div class="relative my-4">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gift-slate/15 dark:border-gift-slate-bright/15"></div>
                    </div>
                    <div class="relative justify-center flex text-xs">
                        <span class="bg-white dark:bg-[#141A24] px-4 py-0.5 text-neutral-dark dark:text-gray-300 rounded-full font-semibold">
                            or continue with
                        </span>
                    </div>
                </div>

            </form>

            <!-- ===== SOCIAL LOGIN BUTTONS ===== -->
            <div class="mt-4">
                <div class="grid grid-cols-2 gap-3">
                    <button class="social-btn group w-full flex items-center justify-center gap-2 py-3 px-2 text-sm"
                        onclick="socialLogin('google')">
                        <i class="fab fa-google text-base"></i>
                        <span>Google</span>
                    </button>
                    <button class="social-btn group w-full flex items-center justify-center gap-2 py-3 px-2 text-sm"
                        onclick="socialLogin('apple')">
                        <i class="fab fa-apple text-base"></i>
                        <span>Apple</span>
                    </button>
                </div>
            </div>

            <!-- ===== "NOT A MEMBER? SIGN UP" LINK ===== -->
            <div class="text-center mt-6 pt-4 border-t border-dashed border-gift-slate/15 dark:border-gift-slate-bright/15">
                <p class="text-sm md:text-base font-semibold text-neutral-dark dark:text-gray-300">
                    New to DriveSim?
                    <a href="signup.html" class="text-gift-slate dark:text-gift-slate-bright font-bold transition ml-1 rtl:mr-1 hover:underline">
                        Create Account
                    </a>
                </p>
                
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Theme Toggle
            const themeBtn = document.getElementById('theme-toggle');
            function setTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    document.documentElement.setAttribute('data-theme', 'gold-obsidian');
                } else {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.setAttribute('data-theme', 'gold-obsidian');
                }
                const moon = themeBtn?.querySelector('.fa-moon');
                const sun = themeBtn?.querySelector('.fa-sun');
                if (isDark) { moon?.classList.add('hidden'); sun?.classList.remove('hidden'); }
                else { moon?.classList.remove('hidden'); sun?.classList.add('hidden'); }
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }

            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    setTheme(!document.documentElement.classList.contains('dark'));
                });
            }

            const savedTheme = localStorage.getItem('theme');
            setTheme(savedTheme === 'dark');

            // 2. RTL Toggle
            const rtlBtn = document.getElementById('rtl-toggle');
            function setRTL(isRTL) {
                document.documentElement.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
                localStorage.setItem('dir', isRTL ? 'rtl' : 'ltr');
            }

            const savedDir = localStorage.getItem('dir');
            setRTL(savedDir === 'rtl');

            if (rtlBtn) {
                rtlBtn.addEventListener('click', () => {
                    setRTL(document.documentElement.getAttribute('dir') !== 'rtl');
                });
            }

            // 3. Password Toggle
            document.querySelectorAll('.toggle-password').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    if (input) {
                        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                        input.setAttribute('type', type);
                        const icon = this.querySelector('i');
                        if (icon) {
                            icon.classList.toggle('fa-eye-slash');
                            icon.classList.toggle('fa-eye');
                        }
                    }
                });
            });

            // 4. Role Selector
            const roleBtns = document.querySelectorAll('.role-btn');
            let selectedRole = 'student';

            roleBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    roleBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedRole = btn.dataset.role;
                });
            });

            // 5. Social login placeholder
            window.socialLogin = function(provider) {
                alert(`Sign in with ${provider} — coming soon. For now, use the demo form.`);
            };

            // 6. Login form submission
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Redirect based on selected role
                const roleMap = {
                    'student': 'student-dashboard.html',
                    'admin': 'admin-dashboard.html',
                    'client': 'client-dashboard.html'
                };
                
                const redirectUrl = roleMap[selectedRole] || 'index.html';
                window.location.href = redirectUrl;
            });

            // 7. Forgot password link
            document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Password reset link will be sent to your registered email.');
            });
        });
    </script>

</body>
</html>
